# LINKFLOW Supabase local configuration
# Docs: https://supabase.com/docs/guides/local-development

project_id = "linkflow"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Social sign-in for local development (`supabase start`). Uncomment and set
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET in your shell before starting.
# Google Cloud Console redirect URI: http://127.0.0.1:54321/auth/v1/callback
# [auth.external.google]
# enabled = true
# client_id = "<google-client-id>"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "8MiB"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.publish-scheduled-posts]
verify_jwt = false
entrypoint = "./functions/publish-scheduled-posts/index.ts"

[analytics]
enabled = false
